<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flagomat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Guess every flag in the world — countries, continents, cities, regions and 200+ memes. Works offline, installs like an app.">
  <meta name="theme-color" content="#6C3BFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flagomat">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" role="status"></div>
  <noscript>Flagomat needs JavaScript to run.</noscript>
  <script src="js/data/countries.js"></script>
  <script src="js/data/cities.js"></script>
  <script src="js/data/memes.js"></script>
  <script src="js/data/facts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
